name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      # The tests of the Rust adapter run nextest itself on a small project (they are skipped
      # when it is not there; here it is, so they are not).
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --target wasm32-unknown-unknown --release
      # What the modules cost in the editor's fuel, run in wasmi (needs the modules just built).
      - run: cargo test -p trcode-test-contract --test fuel -- --ignored
