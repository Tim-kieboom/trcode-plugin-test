[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tim Kieboom"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The plugin API of the editor. A path while plugin-api-1.7 is not on GitHub; then
# `{ git = "https://github.com/Tim-kieboom/TerminalCode", tag = "plugin-api-1.7" }`.
trcode-plugin-api = { path = "../TerminalCode/crates/plugin-api" }
trcode-test-protocol = { path = "crates/protocol" }
