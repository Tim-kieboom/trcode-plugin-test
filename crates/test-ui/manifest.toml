id = "test-ui"
name = "Tests"
version = "0.0.3"
abi = "1.8"
wasm = "test_ui.wasm"
# It calls the adapter; it runs nothing itself.
capabilities = ["plugin.call"]

[[action]]
id = "discover"
title = "Discover Tests"
keys = "d"

[[action]]
id = "run_all"
title = "Run All"
keys = "a"

[[action]]
id = "run_selected"
title = "Run Selected"
keys = "enter"

[[action]]
id = "cancel"
title = "Cancel Run"
keys = "c"

[[action]]
id = "up"
title = "Previous Test"
keys = "up"

[[action]]
id = "down"
title = "Next Test"
keys = "down"

[[action]]
id = "advance"
title = "Advance Fake Clock"
keys = "n"

[[action]]
id = "adapter"
title = "Switch Adapter"
keys = "t"
