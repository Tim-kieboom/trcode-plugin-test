id = "test-ui"
name = "Tests"
version = "0.0.4"
abi = "1.8"
wasm = "test_ui.wasm"
# It calls the adapter; it runs nothing itself. It keeps every test it was told about, and a
# page of them is more work than the flat budget of the shared thread when its table grows
# (found by running it in the editor with 20,000 tests), so it has a thread of its own, where
# the budget grows with the page.
thread = "own"
capabilities = ["plugin.call"]

[[action]]
id = "discover"
title = "Discover Tests"
keys = "d"

[[action]]
id = "run_all"
title = "Run All"
keys = "a"

[[action]]
id = "run_selected"
title = "Run Selected"
keys = "enter"

[[action]]
id = "cancel"
title = "Cancel Run"
keys = "c"

[[action]]
id = "up"
title = "Previous Test"
keys = "up"

[[action]]
id = "down"
title = "Next Test"
keys = "down"

[[action]]
id = "right"
title = "Open Folder"
keys = "right"

[[action]]
id = "left"
title = "Close Folder"
keys = "left"

[[action]]
id = "advance"
title = "Advance Fake Clock"
keys = "n"

[[action]]
id = "adapter"
title = "Switch Adapter"
keys = "t"

[[action]]
id = "use_rust"
title = "Use Rust Adapter"

[[action]]
id = "use_fake"
title = "Use Fake Adapter"
