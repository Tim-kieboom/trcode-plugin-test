id = "rust-adapter"
name = "Rust Test Adapter"
version = "0.0.10"
abi = "1.8"
wasm = "rust_adapter.wasm"
# It works for the test pane and has no pane of its own. It runs cargo nextest in the
# project, which runs code of the project, so the folder must be trusted. Parsing what
# nextest writes is heavy, so it asks for a thread of its own.
view = false
thread = "own"
capabilities = ["plugin.serve", "process.run"]
# `grep` finds the code of a test that did not fail (nextest does not say where a test is):
# `fn name` in the project, outside `target` and `.git`. There is no grep on Windows.
run = [
  "cargo nextest list *",
  "cargo nextest run *",
  "grep -rnwF -I --exclude-dir=target --exclude-dir=.git -e * .",
]
